# The thin Xcode shells over CompanionUI (nativization plan chapter 49): one
# iOS host for iPhone and iPad, one macOS companion host. XcodeGen generates
# Companion.xcodeproj from this manifest on the CI lane (never committed);
# both shells embed CompanionRootView, which owns pairing when no identity
# exists and the six-tab surface after it.
name: Companion
configFiles:
  Debug: Config/Product.xcconfig
  Release: Config/Product.xcconfig
options:
  bundleIdPrefix: com.deepseek-harness
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  DshApple:
    path: .
targets:
  CompanioniOS:
    type: application
    platform: iOS
    sources:
      - Shells/iOSApp.swift
    dependencies:
      - package: DshApple
        product: CompanionUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepseek-harness.companion.ios
        INFOPLIST_FILE: Config/AppInfo.plist
        PRODUCT_NAME: DSH Companion
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        TARGETED_DEVICE_FAMILY: "1,2"
  CompanionMac:
    type: application
    platform: macOS
    sources:
      - Shells/macOSApp.swift
    dependencies:
      - package: DshApple
        product: CompanionUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepseek-harness.companion.mac
        INFOPLIST_FILE: Config/AppInfo.plist
        PRODUCT_NAME: DSH Companion
        GENERATE_INFOPLIST_FILE: true
  DirectHostMac:
    type: application
    platform: macOS
    sources:
      - Hosts/macOSHostApp.swift
      - Hosts/HostSurface.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepseek-harness.host.mac
        INFOPLIST_FILE: Config/AppInfo.plist
        PRODUCT_NAME: DSH Host
        GENERATE_INFOPLIST_FILE: true
  CompanionStartupUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/CompanionStartupTests.swift
    dependencies:
      - target: CompanioniOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepseek-harness.companion.startup-tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  DirectHostMac:
    build:
      targets:
        DirectHostMac: all
  CompanioniOS:
    build:
      targets:
        CompanioniOS: all
    test:
      targets:
        - CompanionStartupUITests
  CompanionMac:
    build:
      targets:
        CompanionMac: all
