# Test-only patch over the shipped headless profile. The driver points the
# production telemetry row at its mock collector through the public env vars.
- id: session-telemetry-otel
  disabled: false

- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: agent-loop
  # Loader entries activate concurrently, and this fixture boots a config agent
  # (production agents are created after boot, through the registry factory).
  # Requiring the persistence backend here orders the agent's session creation
  # after `session-persistence-jsonl` activates, so the canonical log
  # materializes instead of racing into an in-memory session on slow imports.
  inject:
    - sessionPersistence
  config:
    agents:
      - id: main
        provider: cli-mock
        model: cli-mock
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
      config:
        colors: false
        levels:
          default: 3
        showTime: ''

    - id: cli-mock-llm
      name: '../../../../test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'

    # A deployment may register scrub rules on the telemetry waterfall; the
    # shipped telemetry plugin deliberately owns none.
    - id: telemetry-redact-rule
      name: './telemetry-redact-rule.ts'
