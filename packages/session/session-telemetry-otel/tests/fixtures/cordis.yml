# Test-only composition: session-telemetry-otel through the real Loader/app
# path, exporting the owner-level privacy projection to the mock OTLP collector
# the driver starts (url via env).
- id: logger-console
  name: '@deepseek-ai/cordis-plugin-logger-console'
  config:
    colors: false
    levels:
      default: 3
    showTime: ''

- id: cli-mock-llm
  name: '../../../../test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'

# Managed child-process groups required by the bash executor.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: session-telemetry-otel
  name: '@deepseek-ai/dsh-session-telemetry-otel'
  config:
    mode: !!js process.env.DSH_TELEMETRY_E2E_MODE || 'FULL'
    exporter:
      url: !!js process.env.DSH_TELEMETRY_E2E_URL

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: cli-mock
        model: cli-mock
        cwd: !!js process.cwd()
    persona: 'Test the session-telemetry-otel plugin.'
    workspaceContext: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
