# The dsh-desktop-app bundle patch: the desktop surface over the dsh-base
# layer, composed for the Electron app shell (apps/desktop). Applied after
# dsh-base's insert; rows here override base rows by id, with the profile's
# own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The surface differs from dsh-web-app in exactly its carrier: no webserver
# binds, and no webStartup flags parse. The renderer rides the desktop app's
# privileged-scheme bridge, answered in-process by the electron-ipc row; the
# connection row stays mounted for its transport-neutral registry service and
# browser half, with an empty trust list (no network authority exists).

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# TODO: Re-enable shared HMR for Web after its reload lifecycle is tested.
- id: hmr
  disabled: true

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the Web values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in
# a later patch layer, which defers the node:sqlite import and in-memory
# handle to the first search so Node 22 startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    # TEMPORARY workaround: DSH_TOOLS_MODE (native|code|both) opts a whole dsh
    # process into Code Mode while per-session tool-presentation selection is
    # being designed; unset keeps the schema default (native). Remove the env
    # seam once the web UI owns the choice per session.
    mode: !!js process.env.DSH_TOOLS_MODE

# ── desktop-only host rows, the transport layer, and the browser roster ─────

# `dsh.client` rows are the browser roster the modules node half scans into
# window.__DSH_BOOT__; the modules row is simultaneously a host row.
- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # The desktop host runs beside the user with no webserver bind, so the
    # chooser reads its loopback posture from this declaration instead of a
    # running server; the native dialog is the composed default. Mount
    # -native or -browse directly in an overlay to pin the interaction.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'
      config:
        bindHost: 127.0.0.1

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # The API gateway: the transport-agnostic dispatch face every client shape
    # shares. The base layer's agent-default-model service owns the default model.
    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # The desktop carrier: provides desktopGateway, which the app shell wires
    # to the renderer's privileged-scheme fetch. It serves the shared /api
    # chain, the /plugins bundles, and the boot-manifest-injected dist, and
    # binds no socket.
    - id: electron-ipc
      name: '@deepseek-ai/dsh-host-electron-ipc'

    # Desktop glue owned by this bundle: registers the desktop-surface prompt
    # section. A complete agent-preset persona suppresses the section for that
    # agent by disabling this row in an overlay.
    - id: desktop-runtime
      name: '@deepseek-ai/dsh-desktop-app'
      config:
        surfaceContext: true

    # ── browser plugin roster (dsh.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree and composes
    # window.__DSH_BOOT__; the electron-ipc row serves the graph and the
    # /plugins/<id>/client.js bundles; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    # Dual-face transport-neutral half: the node half provides the Connection
    # registry service (the electron-ipc row composes its shared /api chain);
    # the browser half is the fetch/SSE client, selecting the desktop carrier
    # from the page scheme. No trust fence applies in-process.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      config:
        trustedHosts: []

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: client-runtime
      name: '@deepseek-ai/dsh-client-runtime'

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'

    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    - id: ui-sidebar
      name: '@deepseek-ai/dsh-client-ui-sidebar'

    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'

    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'

    - id: ui-settings-models
      name: '@deepseek-ai/dsh-client-ui-settings-models'

    - id: ui-settings-plugin-inventory
      name: '@deepseek-ai/dsh-client-ui-settings-plugin-inventory'

    # Desktop-only preference: the General row for what the window close
    # button does (tray or quit). Its host half registers the `desktop`
    # settings namespace, which the Electron app shell reads through the
    # settings service at close time. The web roster never composes this
    # row, so the preference and its namespace exist only here.
    - id: ui-desktop
      name: '@deepseek-ai/dsh-client-ui-desktop'

    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'

    # Official occupants for the generic sidebar and conversation brand slots.
    - id: ui-brand-official
      name: '@deepseek-ai/dsh-client-ui-brand-official'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@deepseek-ai/dsh-client-ui-tool'

    - id: ui-cordis
      name: '@deepseek-ai/dsh-client-ui-cordis'

    # Durable workflow lifecycle as an independent Chat node after the
    # existing generic workflow tool row.
    - id: ui-workflow-run
      name: '@deepseek-ai/dsh-client-ui-workflow-run'

    # Turn tail: the produced-files row under each closing assistant message.
    # Remove this entry to turn the surface off; the tail hole renders empty.
    - id: ui-deliverables
      name: '@deepseek-ai/dsh-client-ui-deliverables'


    - id: ui-workspace
      name: '@deepseek-ai/dsh-client-ui-workspace'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
    # it (ui-commands), and the two reference sources (ui-skill / ui-subagent).
    - id: ui-input-trigger
      name: '@deepseek-ai/dsh-client-ui-input-trigger'

    - id: ui-commands
      name: '@deepseek-ai/dsh-client-ui-commands'

    - id: ui-skill
      name: '@deepseek-ai/dsh-client-ui-skill'

    - id: ui-subagent
      name: '@deepseek-ai/dsh-client-ui-subagent'

    # Background jobs: the session-header list over the jobsBySession mirror.
    - id: ui-jobs
      name: '@deepseek-ai/dsh-client-ui-jobs'

    # Goal surface: GoalBar in the input dock over the goal session projection.
    - id: ui-goal
      name: '@deepseek-ai/dsh-client-ui-goal'

    # Per-message feedback: Like/Dislike plus an optional note in the
    # assistant-message action strip, over the messageFeedback Remote.
    - id: ui-message-feedback
      name: '@deepseek-ai/dsh-client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over session.models.
    - id: ui-model-selection
      name: '@deepseek-ai/dsh-client-ui-model-selection'

    - id: ui-permission
      name: '@deepseek-ai/dsh-client-ui-permission-presets'

    # The agent-preset row in General settings: the default preset for
    # sessions created later. Absent a roster it renders nothing.
    - id: ui-agent-preset
      name: '@deepseek-ai/dsh-client-ui-agent-preset'

    # Plugin configuration: the host-plane sections a user owns, as expandable
    # cards. A namespace this deployment does not expose renders nothing.
    - id: ui-settings-plugins
      name: '@deepseek-ai/dsh-client-ui-settings-plugins'

    # Plan control: the composer plan seat over the plan projection + /plan channel.
    - id: ui-plan
      name: '@deepseek-ai/dsh-client-ui-plan'

    - id: ui-user-questions
      name: '@deepseek-ai/dsh-client-ui-user-questions'

    - id: ui-trajectory
      name: '@deepseek-ai/dsh-client-ui-trajectory'

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for the TUI, which is single-session and composes its agent process-wide;
# the desktop surface disables them here (same as the Web surface) and lets
# each session mount a preset instead.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone reorders
# the composition.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The background-job REGISTRY stays on the host plane; only the model-facing
# `job_*` controls move (see the dsh-web-app patch for the full criterion).

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

# The `skill` REGISTRY stays in the host plane; only the per-agent rows move
# behind presets (see the dsh-web-app patch for the full criterion).

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# The goal SERVICE, its session driver, and the `/goal` command STAY on the
# host plane; only the model-facing tool moves (see the dsh-web-app patch).

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

# The token METER stays on the host plane; only the compaction backend that
# reads it moves (see the dsh-web-app patch).

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# The subagent registry and its backends STAY in the host plane (see the
# dsh-web-app patch); what a preset chooses is which delegation TOOLS its
# agent sees, below.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

# `tool-subagent-report` is host-plane for the same reason as the registry
# (see the dsh-web-app patch).

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# The preset roster. `config/agent-presets/` ships with the deployment and is
# read-only (its entries carry `system` trust); `$DSH_HOME/.agent-presets` is
# where a person — or an agent — authors their own, and carries the same trust
# as shell access because a preset IS a composition.
#
# Only the SHIPPED root is an assembly fact: it sits beside the installed app's
# own config, so the launcher's `composeProfile` resolves and patches it in.
# The writable root is `dsh-agent-presets`' own default (`includeUserRoot`),
# so a composition that never reaches that patch still finds a person's presets.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
