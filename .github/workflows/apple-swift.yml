name: Apple Swift

# The macOS compile lane (nativization plan chapter 62): Swift sources and
# tests under apps/apple are authored and fixture-drift-gated on every
# change, but only this lane actually compiles and runs them. Zero external
# dependencies, so the job is a checkout plus `swift test`.
on:
  pull_request:
    paths:
      - 'apps/apple/**'
      - '.github/workflows/apple-swift.yml'
  push:
    branches: [dev, master]
    paths:
      - 'apps/apple/**'
      - '.github/workflows/apple-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull-request run cancels; a push run is the branch's latest
# word and stays exempt from cancellation (same policy as ci-master).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift-test:
    runs-on: macos-latest
    name: swift test (macOS)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Report toolchain
        run: swift --version

      - uses: actions/cache@v4
        with:
          path: apps/apple/.build
          key: apple-swift-${{ runner.os }}-${{ hashFiles('apps/apple/Package.swift') }}
          restore-keys: |
            apple-swift-${{ runner.os }}-

      - name: swift test
        working-directory: apps/apple
        run: swift test

      # The thin Xcode shells (chapter 49): XcodeGen turns project.yml into
      # Companion.xcodeproj (generated, never committed), and both hosts must
      # build against the local package the tests just exercised.
      - name: Generate the Xcode project
        working-directory: apps/apple
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Build the iOS shell
        working-directory: apps/apple
        run: xcodebuild -project Companion.xcodeproj -scheme CompanioniOS -destination 'generic/platform=iOS Simulator' build

      - name: Build the macOS shell
        working-directory: apps/apple
        run: xcodebuild -project Companion.xcodeproj -scheme CompanionMac -destination 'platform=macOS' build

      # Chapter 49's fourth target: the host-side surface, isolated from the
      # companion targets so host-only code never pollutes them.
      - name: Build the macOS Direct Host
        working-directory: apps/apple
        run: xcodebuild -project Companion.xcodeproj -scheme DirectHostMac -destination 'platform=macOS' build
