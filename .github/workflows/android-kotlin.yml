name: Android Kotlin

# The Linux compile lane for the Android companion (nativization plan
# chapters 52 and 60): the `core` module is pure JVM Kotlin tested with
# the Kotlin half of the chapter-62 trilingual domain-state conformance,
# and the `app` module assembles the Compose seven-tab surface as a debug
# APK. The lane also boots the shipped Host and runs real Kotlin Link acceptance.
on:
  pull_request:
    paths:
      - '.gitignore'
      - 'apps/android/**'
      - 'apps/cli/config/**'
      - 'apps/cli/package.json'
      - 'apps/cli/tests/link-native-acceptance.e2e.ts'
      - 'native/landlock-run/**'
      - 'packages/**'
      - 'patches/**'
      - 'vendor/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/test-invariants.ts'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - 'vitest.e2e.config.ts'
      - 'vitest.shared.ts'
      - '.github/workflows/android-kotlin.yml'
  push:
    branches: [dev, master]
    paths:
      - '.gitignore'
      - 'apps/android/**'
      - 'apps/cli/config/**'
      - 'apps/cli/package.json'
      - 'apps/cli/tests/link-native-acceptance.e2e.ts'
      - 'native/landlock-run/**'
      - 'packages/**'
      - 'patches/**'
      - 'vendor/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/test-invariants.ts'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
      - 'vitest.e2e.config.ts'
      - 'vitest.shared.ts'
      - '.github/workflows/android-kotlin.yml'
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull-request run cancels; a push run is the branch's latest
# word and stays exempt from cancellation (same policy as ci-master).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gradle-test:
    runs-on: ubuntu-latest
    name: gradle test (core)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # No committed wrapper: the action provisions the pinned Gradle and
      # caches its dependencies per project.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14'

      - name: gradle test
        working-directory: apps/android
        run: gradle --no-daemon test

      - name: Build Host plugins for native acceptance
        run: pnpm run build:official

      - name: Real Host to Kotlin acceptance
        env:
          DSH_LINK_ACCEPTANCE_DRIVER_JSON: '["gradle","--no-daemon","-p","apps/android",":core:nativeAcceptance"]'
          DSH_LINK_ACCEPTANCE_LANGUAGE: kotlin
          DSH_LINK_ACCEPTANCE_RESULT: ${{ runner.temp }}/g1-link-acceptance/kotlin/evidence.json
        run: pnpm exec vitest run --config vitest.e2e.config.ts apps/cli/tests/link-native-acceptance.e2e.ts --no-file-parallelism --retry=0

      - name: Upload Kotlin real-Host acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g1-link-acceptance-kotlin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g1-link-acceptance/kotlin/evidence.json
          if-no-files-found: error

      # The Compose app module (chapter 52's seven-tab surface): assemble the
      # debug APK over the same local modules the tests exercised. The
      # runner image ships the Android SDK with accepted licenses.
      - name: assemble the debug APK
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Allow the runner to use KVM
        run: sudo chown "$USER" /dev/kvm

      - name: Launch the unpaired companion on Android
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: apps/android
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Record Android artifact checksums
        working-directory: apps/android/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk output-metadata.json > SHA256SUMS

      - name: Upload Android app and startup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g1-android-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/android/app/build/outputs/apk/debug/
            apps/android/app/build/outputs/androidTest-results/connected/
            apps/android/app/build/reports/androidTests/connected/
          if-no-files-found: error
