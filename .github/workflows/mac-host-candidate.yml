name: Mac Host candidate

on:
  pull_request:
    paths:
      - 'apps/apple/**'
      - '.github/actions/apple-support-scanner/**'
      - 'native/support-scanner/**'
      - 'scripts/build-apple-support-scanner.py'
      - 'scripts/verify-apple-support-scanner.py'
      - 'scripts/stage-apple-support-scanner.py'
      - 'apps/cli/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'python/sdk-runtime/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/build-exe-for-python-sdk*'
      - 'scripts/smoke-packaged-web.py'
      - 'scripts/produce-mac-host.ts'
      - 'scripts/stage-support-scanner.py'
      - 'scripts/verify-support-exports.py'
      - '.github/security/scanners.json'
      - 'scripts/release/**'
      - 'release/**'
      - '.github/workflows/mac-host-candidate.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable source commit
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mac-host-candidate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    name: ad-hoc Mac Host bundle and native UI
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DSH_RC_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require immutable source
        run: |
          if [[ ! "$DSH_RC_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'source_sha must be a full lowercase Git commit SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.DSH_RC_SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies and XcodeGen
        run: |
          pnpm install --frozen-lockfile
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Verify native bundle rejection paths
        run: |
          pnpm exec vitest run scripts/release/mac-host-bundle.spec.ts scripts/release/support-scanner.spec.ts
          python3 -B -m unittest discover -s scripts/release -p test_mac_host_crash.py
          python3 -B -m unittest discover -s scripts/release -p 'test_support_*.py'
      - uses: ./.github/actions/apple-support-scanner
      - name: Build, assemble and exercise the Mac Host
        run: node --import tsx/esm scripts/produce-mac-host.ts --output "$RUNNER_TEMP/mac-host-candidate"
      - name: Export native Host screenshots
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/mac-host-candidate/HostStartup.xcresult" ]]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/mac-host-candidate/HostStartup.xcresult" \
              --output-path "$RUNNER_TEMP/mac-host-candidate/screenshots"
          fi
      - name: Collect native Host crash facts
        if: always()
        run: python3 -B scripts/release/mac_host_crash.py --output-directory "$RUNNER_TEMP/mac-host-candidate"
      - name: Bind native crash facts to product identity
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/mac-host-candidate/native-crashes.json" ]]; then
            node --import tsx/esm scripts/collect-product-diagnostics.ts --platform macos \
              --directory "$RUNNER_TEMP/mac-host-candidate" --max-input-bytes 4194304
          fi
      - name: Preserve verified Mac Host candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mac-host-candidate-${{ env.DSH_RC_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mac-host-candidate/DSH-Host.app.zip
            ${{ runner.temp }}/mac-host-candidate/*.json
            ${{ runner.temp }}/mac-host-candidate/packaged-web.log
            ${{ runner.temp }}/mac-host-candidate/app-test.log
            ${{ runner.temp }}/mac-host-candidate/test-runner-signing.log
            ${{ runner.temp }}/mac-host-candidate/screenshots
            ${{ runner.temp }}/mac-host-candidate/approved-support
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve Mac Host build and startup diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mac-host-diagnostics-${{ env.DSH_RC_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mac-host-candidate/*.json
            ${{ runner.temp }}/mac-host-candidate/*.log
            ${{ runner.temp }}/mac-host-candidate/HostStartup.xcresult
            ${{ runner.temp }}/mac-host-candidate/screenshots
          if-no-files-found: warn
          retention-days: 7
