name: Android candidate

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'native/support-scanner/**'
      - 'scripts/build-mobile-support-scanner.py'
      - '.github/actions/android-support-scanner/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'release/**'
      - 'scripts/release/**'
      - 'scripts/produce-android-candidate.ts'
      - 'scripts/android-candidate.spec.ts'
      - '.github/workflows/android-candidate.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable source commit
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-candidate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: unsigned AAB and release APK acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DSH_RC_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      DSH_ANDROID_SIGNING_MODE: unsigned
      DSH_ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - name: Require immutable source
        run: |
          if [[ ! "$DSH_RC_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'source_sha must be a full lowercase Git commit SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.DSH_RC_SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.1'
          cache: pnpm
      - name: Install dependencies and verify identity
        run: |
          pnpm install --frozen-lockfile
          test "$(git rev-parse HEAD)" = "$DSH_RC_SOURCE_SHA"
          pnpm run verify-product-identity
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      - name: Install Android and ELF tools
        run: |
          "${ANDROID_HOME:?Android SDK root is required}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' "build-tools;$DSH_ANDROID_BUILD_TOOLS_VERSION"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils
      - name: Verify producer rejection paths
        run: |
          python3 -B -m unittest discover -s scripts/release -p 'test_android_candidate*.py' -v
          pnpm exec vitest run scripts/android-candidate.spec.ts
      - uses: ./.github/actions/android-support-scanner
      - name: Build and validate unsigned release bundle
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:lintRelease :app:validateReleaseBundle
      - name: Allow the runner to use KVM
        run: sudo chown "$USER" /dev/kvm
      - name: Derive, install, scan and verify Android receipt
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          script: node --import tsx/esm scripts/produce-android-candidate.ts --output "$RUNNER_TEMP/android-rc"
      - name: Preserve verified Android candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-rc-${{ env.DSH_RC_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-rc/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
